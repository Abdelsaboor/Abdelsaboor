<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Mowasalahni">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#111c33"/></linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#b45309"/></linearGradient>
  <radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#fbbf24" stop-opacity=".28"/><stop offset=".6" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect x="1" y="1" width="598" height="298" rx="20"/></clipPath>
</defs>
<style>
  .sheen { animation: sheen 6s ease-in-out infinite; }
  @keyframes sheen { 0%, 70% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(800px) skewX(-20deg); } }
  .bar { animation: grow 1.2s cubic-bezier(.2,.7,.2,1) both; transform-origin: 0 0; }
  @keyframes grow { from { transform: scaleX(0); } }
  .pulse { animation: p 2s ease-in-out infinite; }
  @keyframes p { 50% { opacity: .35; } }
</style>
<g clip-path="url(#c)">
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#gl)"/>
  <rect class="bar" width="600" height="5" fill="url(#ac)"/>
  <rect class="sheen" x="0" y="0" width="120" height="300" fill="#fff" opacity=".045"/>
</g>
<rect x="1" y="1" width="598" height="298" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
<rect x="36" y="36" width="56" height="56" rx="16" fill="url(#ac)"/>
