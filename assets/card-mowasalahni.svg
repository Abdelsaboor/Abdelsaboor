<g transform="translate(110 74)"><circle class="pulse" cx="6" cy="9" r="4.5" fill="#22c55e"/><text x="18" y="14" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13" fill="#94a3b8">service booking platform</text></g>
<text x="36" y="136" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#cbd5e1">Connects customers with trusted technicians: bookings,</text><text x="36" y="160" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#cbd5e1">emergency requests, a technician map and ratings, backed by</text><text x="36" y="184" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#cbd5e1">an ASP.NET Core API.</text>
