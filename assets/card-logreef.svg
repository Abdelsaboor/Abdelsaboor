<text x="36" y="136" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#cbd5e1">Centralized logging: a Rust agent tails and ships logs; the</text><text x="36" y="160" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#cbd5e1">platform ingests, searches and charts them, fires alerts and</text><text x="36" y="184" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#cbd5e1">bills by plan.</text>
